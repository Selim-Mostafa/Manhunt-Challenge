name: Build Manhunt iOS
on:
  workflow_dispatch:
  push:
    paths:
      - "Manhunt-iOS/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build iOS Simulator app
        run: |
          xcodebuild -project Manhunt-iOS/Manhunt.xcodeproj -scheme Manhunt -sdk iphonesimulator -configuration Release -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/Manhunt-iOS-Simulator.zip" Manhunt.app

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild -project Manhunt-iOS/Manhunt.xcodeproj -scheme Manhunt -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/Manhunt.app ipa/Payload/
          cd ipa
          zip -r "$GITHUB_WORKSPACE/Manhunt-unsigned.ipa" Payload

      - name: Upload iOS build files
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-ios-builds
          path: |
            Manhunt-iOS-Simulator.zip
            Manhunt-unsigned.ipa
          retention-days: 30

      - name: Publish unsigned IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manhunt-ios-v1.0.0
          name: Manhunt iOS v1.0.0 (Unsigned)
          body: |
            Manhunt Challenge iOS build.

            IMPORTANT: This IPA is unsigned. It is provided for development/testing and cannot be installed on a normal iPhone until it is signed with a valid Apple developer provisioning profile.
          files: Manhunt-unsigned.ipa
          draft: false
          prerelease: false
