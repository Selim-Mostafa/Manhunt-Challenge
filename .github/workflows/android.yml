name: Build and Release Manhunt Challenge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Manhunt-challenge v1.0.0
          body: |
            Manhunt Challenge downloads.

            Android APK: app-debug.apk
            iPhone Web App (PWA): https://selim-mostafa.github.io/Manhunt-Challenge/ (requires GitHub Pages to be enabled for this repository).
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
