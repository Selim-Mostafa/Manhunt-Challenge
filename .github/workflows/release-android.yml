name: Publish Android APK Release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: manhunt-debug-apk
          path: release-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manhunt-android-v1.0.${{ github.event.workflow_run.run_number }}
          name: Manhunt Android v1.0.${{ github.event.workflow_run.run_number }}
          body: |
            Manhunt Challenge Android APK.

            Download the APK below and install it on a compatible Android device.
            This is a debug-signed build of the Manhunt web app wrapper and requires an internet connection.
          files: release-files/app-debug.apk
          draft: false
          prerelease: false
