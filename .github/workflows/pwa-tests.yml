name: Test Manhunt PWA
on:
  push:
    branches: [main]
    paths:
      - "iphone-pwa/**"
      - ".github/workflows/pwa-tests.yml"
  pull_request:
    paths:
      - "iphone-pwa/**"
      - ".github/workflows/pwa-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PWA smoke tests
        run: node iphone-pwa/tests/smoke.mjs
